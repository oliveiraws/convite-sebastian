<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

/* usar SVH como base (est?vel), e DVH quando suportado */
.phone{
  width:100vw;
  height:100vh;      /* fallback antigo */
  height:100svh;     /* est?vel contra barras */
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  /* respeitar notch/home bar */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  box-sizing: border-box;
}

@supports (height: 100dvh){
  .phone{ height:100dvh; }
}

/* stage nunca pode ultrapassar a ?rea vis?vel real */
.stage{
  position:relative;
  aspect-ratio: 9 / 16;
  width:auto;
  max-width:100%;
  max-height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  background:#000;
  overflow:hidden;
}

@supports (height: 100dvh){
  .stage{
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
}

/* 🔥 ESSENCIAL PRA CLIQUE FUNCIONAR */
.stage img,.stage video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  display:none;
  pointer-events:none !important;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
.stage video.video-controls-on{
  pointer-events:auto !important;
}

.fade-transition {
  opacity: 0;
  transition: opacity 0.8s ease !important;
}
.fade-transition.show {
  opacity: 1;
  display: block !important;
}

.show{display:block !important;}

.btnLayer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}
.btnLayer .btn-inv{
  pointer-events:auto;
}

.btn-inv{
  position:absolute;
  display:block;
  z-index:9999;
  pointer-events:auto;
  outline: none !important;
  box-shadow: none !important;
  border: 0 !important;
  background: transparent !important;
  padding:0; margin:0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-inv:focus,
.btn-inv:focus-visible,
.btn-inv:active{
  outline: none !important;
  box-shadow: none !important;
  border: 0 !important;
}
.instagram-filter-download{
  position:absolute;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  z-index:16000;
  display:none;
  min-height:36px;
  padding:10px 14px;
  border-radius:999px;
  border:0;
  background:#111827;
  color:#fff;
  font:700 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  letter-spacing:0.2px;
  text-decoration:none;
  text-align:center;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
.instagram-filter-download:focus,
.instagram-filter-download:focus-visible,
.instagram-filter-download:active{
  color:#fff;
  text-decoration:none;
}
.instagram-filter-preview{
  position:absolute;
  inset:0;
  z-index:15950;
  display:none;
  background:#fff;
  box-sizing:border-box;
  padding:12px 12px 64px;
  pointer-events:none;
}
.instagram-filter-preview-image{
  display:block !important;
  width:100%;
  height:100%;
  object-fit:contain;
  position:relative;
  z-index:1;
}

.pg3-only,.pg4-only{display:none;}
body.pg3 .pg3-only{display:block;}
body.pg4 .pg4-only{display:block;}

#startBtn{
  position:fixed;
  left:0;
  top:0;
  width:100vw;
  height:100vh;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  z-index:20000;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

#videoTap{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  z-index:12000;
  display:none;
}

#skipIntroBtn{
  position:absolute;
  right:12px;
  bottom:calc(env(safe-area-inset-bottom) + 20px);
  z-index:17000;
  display:none;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:999px;
  background:rgba(17,24,39,.9);
  color:#fff;
  font:700 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
  letter-spacing:.2px;
  min-height:34px;
  padding:10px 12px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}


/* start não pode ficar por cima depois */
.started #startBtn{display:none !important; pointer-events:none !important;}

    if(mp && typeof mp.then === "function"){ mp.catch(function(){}); }
  }
}
function onPageVideoLeft(){
  restoreMusic();
  resumeMusicIfNeeded();
}
function applyPageVideoSound(videoEl){
  if(!videoEl || videoEl.tagName !== "VIDEO" || videoEl.getAttribute("data-wants-sound") !== "1") return;
  if(!videoEl.__yupSoundBound){
    videoEl.__yupSoundBound = true;
    videoEl.addEventListener("play", function(){ applyDuck(); resumeMusicIfNeeded(); }, { passive:true });
    videoEl.addEventListener("ended", restoreMusic, { passive:true });
  }
  // o video pode ter tocado escondido (autoplay) e avancado; reinicia do comeco
  try{ videoEl.currentTime = 0; }catch(e){}
  // toca MUDO primeiro (autoplay confiavel) e desmuta so depois que o play engatar
  try{ videoEl.muted = true; }catch(e){}
  function __afterPlay(){
    try{ videoEl.muted = false; videoEl.volume = 1; }catch(e){}
    applyDuck();
    // reativa a musica (baixinha) para tocar JUNTO do video, igual a pagina 2
    resumeMusicIfNeeded();
    setTimeout(resumeMusicIfNeeded, 300);
  }
  var pp = videoEl.play && videoEl.play();
  if(pp && typeof pp.then === "function"){
    pp.then(__afterPlay).catch(function(){});
  } else {
    __afterPlay();
  }
}
function startPageVideo(videoEl){
  if(!videoEl || videoEl.tagName !== "VIDEO") return;
  if(videoEl.getAttribute("data-wants-sound") === "1"){
    applyPageVideoSound(videoEl);
    return;
  }
  try{ videoEl.pause(); }catch(e){}
  try{ videoEl.currentTime = 0; }catch(e){}
  try{ videoEl.muted = true; }catch(e){}
  var pp = videoEl.play && videoEl.play();
  if(pp && typeof pp.then === "function"){ pp.catch(function(){}); }
}
function goToFirstInteractivePage(){
  hideSkipIntroBtn();
  clearPgClasses();
  document.body.classList.add("pg3");
  hideAllMedia();
  const el = document.getElementById("pd3");
  if(el){
    if(el.classList.contains('fade-transition')){
      el.style.display = 'block';
      requestAnimationFrame(() => { el.classList.add("show"); });
    } else {
      el.classList.add("show");
    }
    if(el.tagName === "VIDEO") startPageVideo(el);
  }
}

function hideAllMedia(){
  if(cover){
    cover.classList.remove("show");
    if(cover.classList.contains("fade-transition")) cover.style.display = "";
  }
  if(vid) vid.classList.remove("show");
  document.querySelectorAll('img[id^="pd"],video[id^="pd"]').forEach(el => {
    el.classList.remove("show");
    if(el.classList.contains("fade-transition")) el.style.display = "";
    if(el.tagName === "VIDEO"){
      try{ el.pause(); }catch(e){}
      if(el.getAttribute("data-wants-sound") === "1") restoreMusic();
    }
  });
}
function clearPgClasses(){
  ["pg3","pg4"].forEach(c => document.body.classList.remove(c));
}
async function liberarAudioIOS(){
  if(!mus || mus.__yupIOSWebAudioStarted || (audioLiberado && !mus.paused)) return;
  try{
    mus.__yupAudioUnlockPending = true;
    mus.muted = false;
    if(!(Number(mus.volume) > 0)) mus.volume = duckApplied ? Math.max(0, Math.min(1, DUCK_FACTOR)) : BASE_VOLUME;
    try{ mus.setAttribute("preload", "auto"); }catch(err){}
    try{ if(mus.networkState === 0 && typeof mus.load === "function") mus.load(); }catch(err){}
    await mus.play();
    audioLiberado = true;
    syncBaseVolume();
  }catch(e){}
}

function mostrarPg3(){
  clearPgClasses();
  document.body.classList.add("pg3");
  hideAllMedia();
  const el = document.getElementById("pd3");
  if(el){
    if(el.classList.contains('fade-transition')){
      el.style.display = 'block';
      requestAnimationFrame(() => { el.classList.add("show"); });
    } else {
      el.classList.add("show");
    }
    if(el.tagName === "VIDEO") startPageVideo(el);
  }
}

function mostrarPg4(){
  clearPgClasses();
  document.body.classList.add("pg4");
  hideAllMedia();
  const el = document.getElementById("pd4");
  if(el){
    if(el.classList.contains('fade-transition')){
      el.style.display = 'block';
      requestAnimationFrame(() => { el.classList.add("show"); });
    } else {
      el.classList.add("show");
    }
    if(el.tagName === "VIDEO") startPageVideo(el);
  }
}

startBtn.addEventListener("click", async () => {
  document.body.classList.add("started");
  try{ var __audioUnlockPromise = liberarAudioIOS({ fromStart: true, retryPending: true }); if(__audioUnlockPromise && typeof __audioUnlockPromise.catch === "function") __audioUnlockPromise.catch(function(){}); }catch(e){}
  try{ var __initAudioPromise = initWebAudio(); if(__initAudioPromise && typeof __initAudioPromise.catch === "function") __initAudioPromise.catch(function(){}); }catch(e){}

  startBtn.style.display="none";
  startBtn.style.pointerEvents="none";
  if(cover){
    cover.classList.remove("show");
    if(cover.classList.contains("fade-transition")) cover.style.display = "";
  }

  if(vid && (vid.currentSrc || vid.getAttribute("src"))){
    vid.loop=false;
    vid.muted=true;
    vid.defaultMuted=true;
    vid.volume=1;
    vid.classList.add("show");
    showSkipIntroBtn();
    try{
      await vid.play();
      vid.muted=videoShouldBeMuted;
      if(videoTap) videoTap.style.display="none";
    }catch(e){
      // NAO IR PRA PG3
      // fica na pg2 e libera toque do usuario para iniciar
      if(useVideoTapOverlay && videoTap) videoTap.style.display="block";
    }
  }else{
    goToFirstInteractivePage();
  }
});

if(skipIntroBtn){
  skipIntroBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    if(vid){
      try{ vid.pause(); }catch(err){}
    }
    restoreMusic();
    if(vid && vid.classList.contains('fade-transition')){
      vid.style.transition = 'opacity 0.8s ease';
      vid.style.opacity = '0';
      setTimeout(function(){ goToFirstInteractivePage(); }, 800);
    } else {
      goToFirstInteractivePage();
    }
  });
}

if(vid && videoTap){
  videoTap.addEventListener("click", async ()=>{
    try{
      await vid.play();
      vid.muted=videoShouldBeMuted;
      videoTap.style.display="none";
    }catch(e){}
  });
}

if(vid){
  vid.addEventListener("play", () => { applyDuck(); }, { passive:true });
  vid.addEventListener("pause", () => { restoreMusic(); }, { passive:true });
  vid.addEventListener("ended", () => { restoreMusic(); }, { passive:true });
  vid.addEventListener("emptied", () => { restoreMusic(); }, { passive:true });
  vid.addEventListener("ended", async () => {
    await liberarAudioIOS();
    if(vid && vid.classList.contains('fade-transition')){
      vid.style.transition = 'opacity 0.8s ease';
      vid.style.opacity = '0';
      setTimeout(function(){ goToFirstInteractivePage(); }, 800);
    } else {
      goToFirstInteractivePage();
    }
  });
}
</script>
